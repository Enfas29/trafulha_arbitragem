name: Diagnostico Arbitragem V11

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostico-v11
  cancel-in-progress: false

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Diagnosticar mercados e livros de ordens sem apostar
        env:
          SX_API_KEY: ${{ secrets.SX_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/diagnostico_arbitragem_v11.py


name: Validar Trafulha Paper V15

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v13-speed-storage
      - v13-paper-refresh-20261127
      - v13-speed-safe-20261127
      - v13-live-paper-20261127
      - v14-bankroll-reset-20261127
      - v15-opportunities-20261127
  pull_request:
    branches:
      - main

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar o robô
        run: python trafulha_arbitragem.py --self-test

      - name: Testar o monitor e historico SQLite (offline)
        run: python monitor_v11.py --self-test

      - name: Testar recuperação segura SQLite (offline)
        run: python recuperar_espaco_v12.py --self-test

      - name: Testar cache curta de eventos WS e prioridade/latência (offline)
        run: |
          python ws_priority_v12.py
          python poly_ws_v12.py
          python sx_ws_v12.py
          python monitor_v11.py --self-test

      - name: Testar V12 de paper trading (offline, sem APIs)
        run: python paper_v12.py --self-test

      - name: Testar auditoria histórica da margem de 49% (somente leitura)
        run: python auditoria_margem_49_v12.py --self-test

      - name: Testar Paper V12 com ROI mínimo 0,5% (offline)
        env:
          PAPER_V12_MIN_NET_ROI_PCT: "0.5"
        run: |
          python paper_v12.py --self-test
          python test_integration_v12.py

      - name: Testar sinais WebSocket V12 (offline)
        run: python sx_ws_v12.py

      - name: Testar WebSocket Polymarket V12 (offline)
        run: python poly_ws_v12.py

      - name: Testar fluxo integral do Paper V12 (offline)
        run: python test_integration_v12.py

      - name: Verificar isolamento das chaves API (offline)
        run: python test_security_v12.py

      - name: Testar cotacao pontual com margem negativa (offline)
        run: python teste_odds_reais_v12.py --self-test

      - name: Testar dois avisos e carteiras fictícias (offline)
        run: python demonstracao_carteiras_v12.py --self-test

      - name: Testar auditoria de varios jogos e futebol 1X2 (offline)
        run: python auditoria_jogos_v12.py --self-test

      - name: Testar paralelismo e retencao V13 (offline)
        run: python test_speed_storage_v13.py

      - name: Testar migração, carteiras e avisos persistentes V13 (offline)
        run: python test_paper_lifecycle_v13.py

      - name: Testar resultados oficiais V13 com dados fictícios (offline)
        run: python test_paper_results_v13.py

      - name: Testar isolamento do worker de resultados (offline)
        run: python test_paper_service_v13.py

      - name: Testar fila reativa, frescura e isolamento V13.2 (offline)
        run: |
          python test_reactive_scheduler_v13.py
          python test_latency_metrics_v13.py
          python test_monitor_workers_v13.py
          python test_monitor_reactive_v13.py
          python test_paper_freshness_v13.py
          python test_poly_refresh_v13.py

      - name: Testar direto confirmado, atrasos e integração V13.3 (offline)
        run: |
          python test_live_market_v13.py
          python test_live_candidates_v13.py
          python test_paper_live_v13.py
          python test_monitor_live_v13.py

      - name: Testar banca proporcional, concorrência e reset V14 (offline)
        run: |
          python test_bankroll_v14.py
          python test_paper_bankroll_v14.py
          python test_paper_reset_v14.py
          python test_monitor_bankroll_v14.py

      - name: Testar custos, diagnóstico, cobertura e paralelismo V15 (offline)
        run: |
          python test_market_costs_v15.py
          python test_paper_costs_v15.py
          python test_decision_audit_v15.py
          python test_discovery_v15.py
          python test_ws_coverage_v15.py
          python test_parallel_books_v15.py
          python test_monitor_opportunities_v15.py

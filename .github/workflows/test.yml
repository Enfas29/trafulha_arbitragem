
name: Testar Robô V11

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar o robô
        run: python trafulha_arbitragem.py --self-test

      - name: Testar o monitor e historico SQLite (offline)
        run: python monitor_v11.py --self-test

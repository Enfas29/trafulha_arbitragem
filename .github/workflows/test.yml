
name: Testar Robô V11

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar o robô
        run: python trafulha_arbitragem.py --self-test

      - name: Testar o monitor e historico SQLite (offline)
        run: python monitor_v11.py --self-test

      - name: Testar V12 de paper trading (offline, sem APIs)
        run: python paper_v12.py --self-test

      - name: Testar sinais WebSocket V12 (offline)
        run: python sx_ws_v12.py

      - name: Testar WebSocket Polymarket V12 (offline)
        run: python poly_ws_v12.py

      - name: Testar fluxo integral do Paper V12 (offline)
        run: python test_integration_v12.py

      - name: Verificar isolamento das chaves API (offline)
        run: python test_security_v12.py

      - name: Testar cotacao pontual com margem negativa (offline)
        run: python teste_odds_reais_v12.py --self-test

      - name: Testar dois avisos e carteiras fictícias (offline)
        run: python demonstracao_carteiras_v12.py --self-test

      - name: Testar auditoria de varios jogos e futebol 1X2 (offline)
        run: python auditoria_jogos_v12.py --self-test
